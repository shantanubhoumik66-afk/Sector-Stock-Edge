name: Update market data
on:
  schedule:
    - cron: "45 11 * * 1-6"
    - cron: "30 3 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests
      - run: python market_engine.py
      - run: |
          git config user.name "market-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
          
