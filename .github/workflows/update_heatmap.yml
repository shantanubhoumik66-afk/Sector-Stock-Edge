name: Update heatmap
on:
  schedule:
    - cron: "10 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy
      - run: python heatmap_engine.py
      - run: |
          git config user.name "heatmap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add heatmap.json
          git diff --cached --quiet || (git commit -m "Update heatmap" && git push)
          
