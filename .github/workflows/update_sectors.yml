name: Update sector ranking
on:
  schedule:
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests
      - run: python sector_engine.py
      - run: |
          git config user.name "sector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sectors.json
          git diff --cached --quiet || (git commit -m "Update sectors" && git push)
          
