name: Update power engine
on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy
      - run: python power_engine.py
      - run: |
          git config user.name "power-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A health.json master.json power.json audit last_good 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update power engine" && git push)
