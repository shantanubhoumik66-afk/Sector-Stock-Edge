name: Update option data
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: option-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python option_engine.py
      - run: |
          git config user.name "option-bot"
          git config user.email "bot@users.noreply.github.com"
          git add option.json option_day.json option_history
          git diff --cached --quiet || (git commit -m "Update option data" && git push)
          
