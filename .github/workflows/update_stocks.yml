name: Update stock search
on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas numpy requests
      - run: python stock_engine.py
      - run: |
          git config user.name "stock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stocks.json
          git diff --cached --quiet || (git commit -m "Update stock search" && git push)
          
