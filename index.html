<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Edge</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12306b"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171a;--mu:#6b7280;--bd:#e3e6ea;--gd:#0a8f4e;--bdc:#d93025;--ac:#2557d6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mu:#98a0ab;--bd:#2a2f37;--gd:#3ccf85;--bdc:#ff6b60;--ac:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:12px 12px 80px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0}h2{font-size:16px;margin:10px 0 4px}.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;margin:10px 0}.btn{flex:1;padding:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px;font-weight:600}
.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.on.g{background:var(--gd);border-color:var(--gd)}.btn.on.b{background:var(--bdc);border-color:var(--bdc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.sym{font-weight:700}.pos{color:var(--gd)}.neg{color:var(--bdc)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right}
.badge{padding:4px 10px;border-radius:999px;color:#fff;font-weight:700;font-size:13px}.LOW{background:var(--gd)}.OK{background:var(--ac)}.HIGH{background:var(--bdc)}.NA{background:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mu);font-size:14px;font-weight:600}nav button.on{color:var(--ac);border-top:3px solid var(--ac)}
.back{background:none;border:0;color:var(--ac);font-size:15px;padding:6px 0}a{color:var(--ac)}
</style></head><body>
<h1>Market Edge</h1><div class="mu" id="upd">Loading…</div><div id="app"></div>
<nav><button id="t0" onclick="go(0)">Sector</button><button id="t1" onclick="go(1)">Right valuation</button><button id="t2" onclick="go(2)">Order book</button></nav>
<script>
let D=null,tab=0,sub="top",sec=null,sel=null,qy="",ord=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>v==null?"–":Number(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const p=v=>v==null?"–":`<span class="${v>=0?"pos":"neg"}">${v>0?"+":""}${n(v)}%</span>`;
async function load(){
  try{D=await (await fetch("data.json?t="+Date.now(),{cache:"no-store"})).json()}catch(e){$("app").innerHTML="<p>Could not load data.</p>";return}
  $("upd").textContent=D.updated?"Data updated: "+new Date(D.updated).toLocaleString():"No data yet. Run the GitHub Action once.";
  render();
}
function go(t){tab=t;sec=null;ord=null;render()}
function render(){
  [0,1,2].forEach(i=>$("t"+i).className=i==tab?"on":"");
  if(!D||!D.updated){$("app").innerHTML="<p class='mu'>No data available yet.</p>";return}
  [sectorTab,valTab,ordTab][tab]();
}
function sectorTab(){
  const S=D.sectors,L=S[sub];
  if(sec!==null)return sectorDetail(L[sec]);
  const nf=D.nifty;
  $("app").innerHTML=`<div class="mu">Nifty: 1M ${p(nf.r1)} · 3M ${p(nf.r3)} · ${nf.up200?"above":"below"} 200-day average</div>
  <div class="row"><button class="btn g ${sub=="top"?"on":""}" onclick="sub='top';render()">Top performer</button><button class="btn b ${sub=="under"?"on":""}" onclick="sub='under';render()">Underperformer</button></div>`+
  L.map((s,i)=>`<div class="card" onclick="sec=${i};render()"><div class="top"><span class="sym">${esc(s.name)}</span><span class="${s.score>=0?"pos":"neg"}">${s.score}</span></div>
  <div class="mu">Typical driver: ${esc(s.driver)}</div><div style="font-size:13px;margin-top:4px">${s.reasons.map(esc).join(" · ")}</div></div>`).join("")+
  (sub=="top"&&S.emerging.length?`<div class="mu" style="margin-top:12px">Watch next (momentum improving): ${S.emerging.map(esc).join(", ")}</div>`:"");
}
function sectorDetail(s){
  $("app").innerHTML=`<button class="back" onclick="sec=null;render()">← Back</button><h2>${esc(s.name)}</h2><div class="mu">Top 3 performing stocks in this sector</div>`+
  s.stocks.map(x=>`<div class="card"><div class="top"><span><span class="sym">${esc(x.symbol)}</span> <span class="mu">${esc(x.name)}</span></span><b>₹${n(x.price)}</b></div>
  <div style="font-size:13px;margin-top:4px">1M ${p(x.r1)} · 3M ${p(x.r3)} · vs Nifty (3M) ${p(x.rs3)}</div></div>`).join("");
}
function valTab(){
  const q=qy.trim().toLowerCase();
  const m=q?D.valuation.filter(v=>v.symbol.toLowerCase().includes(q)||v.name.toLowerCase().includes(q)).slice(0,8):[];
  $("app").innerHTML=`<input id="q" placeholder="Search stock name or symbol" value="${esc(qy)}" oninput="qy=this.value;sel=null;valTab();$('q').focus();$('q').setSelectionRange(qy.length,qy.length)">`+
  (sel?valCard(D.valuation.find(v=>v.symbol==sel)):m.map(v=>`<div class="card" onclick="sel='${v.symbol}';valTab()"><span class="sym">${esc(v.symbol)}</span> <span class="mu">${esc(v.name)}</span></div>`).join("")||(q?"<p class='mu'>Not found. Only Nifty 500 stocks are covered.</p>":"<p class='mu'>Type a stock name to see its valuation.</p>"));
}
function valCard(v){
  const c=v.verdict=="N/A"?"NA":v.verdict,lab={LOW:"LOW valuation",OK:"RIGHT valuation (OK)",HIGH:"HIGH valuation","N/A":"Not available"}[v.verdict];
  const sm=v.sector_med||{};
  return `<div class="card"><div class="top"><span><span class="sym">${esc(v.symbol)}</span><div class="mu">${esc(v.name)} · ${esc(v.industry)}</div></span><span class="badge ${c}">${lab}</span></div>
  <h2>₹${n(v.price)} <span class="mu">M.Cap ₹${n(v.mcap_cr)} cr</span></h2>
  <table><tr><td>PE (sector median ${n(sm.pe)})</td><td>${n(v.pe)}</td></tr><tr><td>Forward PE</td><td>${n(v.fpe)}</td></tr>
  <tr><td>EV/EBITDA (sector ${n(sm.ev)})</td><td>${n(v.ev)}</td></tr><tr><td>P/B (sector ${n(sm.pb)})</td><td>${n(v.pb)}</td></tr>
  <tr><td>PEG</td><td>${n(v.peg)}</td></tr><tr><td>ROE</td><td>${v.roe==null?"–":n(v.roe*100)+"%"}</td></tr>
  <tr><td>Earnings growth</td><td>${v.eg==null?"–":n(v.eg*100)+"%"}</td></tr><tr><td>Revenue growth</td><td>${v.rg==null?"–":n(v.rg*100)+"%"}</td></tr>
  <tr><td>Debt / Equity</td><td>${n(v.de)}</td></tr></table>
  <p class="mu">${v.why.map(esc).join(" · ")}</p><button class="back" onclick="sel=null;valTab()">← Back to search</button></div>`;
}
function ordTab(){
  const O=D.orders||[];
  if(ord!==null){const o=O[ord];$("app").innerHTML=`<button class="back" onclick="ord=null;render()">← Back</button><div class="card"><h2>${esc(o.symbol)} <span class="mu">${esc(o.date)}</span></h2><div class="mu">${esc(o.title)}</div><p>${esc(o.text)}</p>${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">Open filing (PDF)</a>`:""}</div>`;return}
  $("app").innerHTML=`<div class="mu">Biggest order wins announced to the exchange in the last 90 days (value shown only when stated in the filing)</div>`+
  (O.map((o,i)=>`<div class="card" onclick="ord=${i};render()"><div class="top"><span><span class="sym">${esc(o.symbol)}</span> <span class="mu">${esc(o.date)}</span></span><b>${o.value_cr?"₹"+n(o.value_cr)+" cr":"Value n/a"}</b></div>
  <div class="mu">${esc(o.name)}</div><div style="font-size:13px">${esc((o.text||o.title).slice(0,140))}…</div></div>`).join("")||"<p class='mu'>No orders found.</p>");
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sel===null&&sec===null&&ord===null&&tab!=1)load()});
</script></body></html>
