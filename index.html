<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sector Stock Edge</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#12306b"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171a;--mu:#5b6270;--bd:#dfe3e8;--gd:#0a8f4e;--bdc:#d93025;--ac:#2557d6;--navtx:#141828;--navfill:rgba(255,255,255,.15)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#e8eaed;--mu:#98a0ab;--bd:#2a2f37;--gd:#3ccf85;--bdc:#ff6b60;--ac:#7aa2ff;--navtx:#f2f5ff;--navfill:rgba(255,255,255,.10)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:12px 12px 90px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0}h2{font-size:15px;margin:12px 0 6px}.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.btn{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:14px;font-weight:600}
.btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.g.on{background:var(--gd);border-color:var(--gd)}.btn.b.on{background:var(--bdc);border-color:var(--bdc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.sym{font-weight:700}.pos{color:var(--gd)}.neg{color:var(--bdc)}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}td{padding:6px 4px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right}
.badge,.tag{display:inline-block;padding:4px 10px;border-radius:999px;color:#fff;font-weight:700;font-size:12px;margin:2px}
.LOW{background:var(--gd)}.OK{background:var(--ac)}.HIGH{background:var(--bdc)}.NA,.nofo{background:var(--mu)}.fno{background:var(--gd)}.tag{background:var(--bd);color:var(--tx);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--bd);overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--ac)}
.brow{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0}.brow span:first-child{width:64px}.brow .bar{flex:1;margin:0}.brow span:last-child{width:52px;text-align:right}
nav{position:fixed;bottom:10px;left:10px;right:10px;margin:auto;max-width:620px;display:flex;gap:8px;background:transparent;padding:6px;z-index:10;-webkit-font-smoothing:antialiased}
nav button{flex:1;padding:12px 2px;border-radius:24px;border:1px solid #0b1f4d;background:linear-gradient(90deg,#0b1f4d,#5fb6ff);color:#ffffff;font-size:11px;font-weight:700;cursor:pointer;box-shadow:none;transition:all .25s ease;text-shadow:none}
nav button:hover,nav button:active,nav button.on{background:linear-gradient(180deg,#d4ffcb,#8af57e);color:#0a2e0c;border-color:rgba(200,255,190,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 14px rgba(140,245,120,.6),0 6px 14px rgba(0,0,0,.25)}
nav button:active{transform:scale(.95)}
.back{background:none;border:0;color:var(--ac);font-size:15px;padding:6px 0}
</style></head><body>
<h1>Sector Stock Edge</h1><div class="mu" id="upd">Loading…</div><div id="app"></div>
<nav>
<button id="t0" onclick="go(0)">Sector</button><button id="t1" onclick="go(1)">Right valuation</button><button id="t2" onclick="go(2)">Order book</button><button id="t3" onclick="go(3)">Search</button><button id="t4" onclick="go(4)">F&amp;O Stocks</button><button id="t5" onclick="go(5)">Options</button><button id="t6" onclick="go(6)">Results</button>
</nav>
<script>
let PSEL=null,POW=null,HEALTH=null,RFIL="all",RSUB="present",RSEL=null,RES=null,oq="",osel=null,OPT=null,OPTD=null,OWIN=5,SR=null,SEC=null,TR=false,TRD=null,BT=null,RS=null,D=null,SX=null,tab=0,sub="top",sec=null,sel=null,qy="",sq="",ord=null,fq="all",fsel=null,ssel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n=v=>v==null?"–":Number(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const p=v=>v==null?"–":`<span class="${v>=0?"pos":"neg"}">${v>0?"+":""}${n(v)}%</span>`;
async function j(f){try{return await (await fetch(f+"?t="+Date.now(),{cache:"no-store"})).json()}catch(e){return null}}
async function load(){
  D=await j("data.json"); SX=await j("stocks.json"); TRD=await j("track_record.json"); BT=await j("backtest.json"); SEC=await j("sectors.json"); OPT=await j("option.json"); OPTD=await j("option_day.json"); RES=await j("results.json"); POW=await j("power.json"); HEALTH=await j("health.json");
  const t=(D&&D.updated)||(SX&&SX.updated);
  $("upd").textContent=t?"Data updated: "+new Date(t).toLocaleString():"No data yet. Run the GitHub Actions once.";
  if(HEALTH&&HEALTH.summary)$("upd").textContent+=" · Data health: "+HEALTH.summary;
  render();
}
function go(t){SR=null;RS=null;tab=t;sec=null;sel=null;ord=null;fsel=null;ssel=null;render()}
function render(){
  [0,1,2,3,4,5,6].forEach(i=>$("t"+i).className=i==tab?"on":"");
  if(tab<3&&(!D||!D.updated)){$("app").innerHTML="<p class='mu'>Sector data not available yet.</p>";return}
  [sectorTab,valTab,ordTab,searchTab,foTab,optTab,resTab][tab]();
}
/* ---------- Tab 0: Sector ---------- */
function wl(){try{return JSON.parse(localStorage.getItem("sse_watch")||"[]")}catch(e){return []}}
function wlToggle(sym){let a=wl();a=a.includes(sym)?a.filter(x=>x!=sym):a.concat([sym]);localStorage.setItem("sse_watch",JSON.stringify(a));sectorTab()}
function powerView(){
  if(PSEL!==null){const s=(SX&&SX.stocks||[]).find(x=>x.symbol==PSEL);return `<button class="back" onclick="PSEL=null;sectorTab()">← Back</button>`+stockCard(s)}
  const W=wl(); const rows=(POW&&POW.top)||[];
  const pool=sub=="watch"?W.map(sym=>rows.find(x=>x.symbol==sym)||{symbol:sym,name:sym,score:null,why:["Not in today's power list"],fno:null}):rows;
  const note=sub=="power"
    ?`<div class="mu">${esc((POW&&POW.note)||"Power picks appear after the power engine runs.")}</div>`
    :`<div class="mu">Your starred stocks. Tap ☆ or ★ to add or remove.</div>`;
  const head=`<div class="row"><button class="btn ${sub=="power"?"on":""}" onclick="sub='power';sectorTab()">Power picks</button><button class="btn ${sub=="watch"?"on":""}" onclick="sub='watch';sectorTab()">Watchlist (${W.length})</button></div>`;
  return head+note+pool.map((x,i)=>`<div class="card" onclick="PSEL='${x.symbol}';sectorTab()"><div class="top"><span><span class="badge ${x.fno?"LOW":"NA"}">${x.fno==null?"–":x.fno?"F&O":"Non F&O"}</span> ${sub=="power"?`<span class="mu">#${i+1}</span> `:""}<span class="sym">${esc(x.symbol)}</span><div class="mu">${esc(x.name||"")}${x.sector?" · "+esc(x.sector):""}</div></span>
    <span><b>${x.score==null?"–":n(x.score)}</b> <button class="badge NA" style="border:0;cursor:pointer" onclick="event.stopPropagation();wlToggle('${x.symbol}')">${W.includes(x.symbol)?"★":"☆"}</button></span></div>
    <div style="font-size:13px;margin-top:4px">${(x.why||[]).map(esc).join(" · ")}</div></div>`).join("")||"<p class='mu'>Nothing here yet. Run the Update power engine workflow after the data updates.</p>";
}
function sectorTab(){
  if(sub=="power"||sub=="watch"){$("app").innerHTML=powerView();return}
  if(!SEC||!SEC.sectors||!SEC.sectors.length){$("app").innerHTML="<p class='mu'>Sector ranking not built yet. Run the 'Update sector ranking' workflow once.</p>";return}
  if(SR!==null){$("app").innerHTML=sectorReason(SR);return}
  if(sec!==null){$("app").innerHTML=`<button class="back" onclick="sec=null;render()">← Back</button>`+sectorStocks(sec);return}
  const all=SEC.sectors.map((x,i)=>i);
  const L=sub=="top"?all.slice(0,3):all.slice(-3).reverse();
  const f=SEC.flows||{};
  $("app").innerHTML=`<div class="card"><div class="mu">${esc(f.text||"")}</div></div>
  <div class="row"><button class="btn g ${sub=="top"?"on":""}" onclick="sub='top';render()">Top performer</button><button class="btn b ${sub=="under"?"on":""}" onclick="sub='under';render()">Underperformer</button></div><div class="row"><button class="btn ${sub=="power"?"on":""}" onclick="sub='power';render()">Power picks</button><button class="btn ${sub=="watch"?"on":""}" onclick="sub='watch';render()">Watchlist</button></div>`+
  L.map(i=>{const x=SEC.sectors[i];return `<div class="card" onclick="sec=${i};render()"><div class="top"><span class="sym">${esc(x.name)}</span><span class="${x.score>=50?"pos":"neg"}">${n(x.score)}/100</span></div>
  <div class="mu">${x.n} stocks · median 3M ${p(x.tech_rs3)} vs Nifty</div>
  <div class="row" style="margin:8px 0 0"><button class="btn" style="flex:none;padding:8px 12px" onclick="event.stopPropagation();SR=${i};render()">Reason for performance</button></div></div>`}).join("");
}
function sectorStocks(i){
  const x=SEC.sectors[i];
  return `<h2>${esc(x.name)}: top 3 outperforming stocks</h2>`+x.stocks.map(s=>`<div class="card"><div class="top"><span><span class="sym">${esc(s.symbol)}</span> <span class="mu">${esc(s.name)}</span></span><b>₹${n(s.price)}</b></div>
  <div style="font-size:13px;margin-top:4px">3M ${p(s.rs3)} vs Nifty · momentum ${n(s.momentum)} · ${esc(s.bias)}</div></div>`).join("");
}
function sectorReason(i){
  const x=SEC.sectors[i]; const top=x.group=="TOP"; const want=top?"UP":"DOWN";
  const row=f=>`<div class="card"><div class="top"><b>${esc(f.label)}</b><span class="mu">weight ${f.weight}%</span></div>
   <div class="bar"><i style="width:${f.pct==null?0:f.pct}%;background:${f.dir=="UP"?"var(--gd)":f.dir=="DOWN"?"var(--bdc)":"var(--ac)"}"></i></div>
   <div style="font-size:13px">${esc(f.text)}</div><div class="mu">Source: ${esc(f.src)} · rank ${f.pct==null?"–":n(f.pct)}/100</div></div>`;
  const main=x.factors.filter(f=>f.dir==want), other=x.factors.filter(f=>f.dir!=want);
  const hl=(x.headlines||[]).map(h=>`<div class="card"><div>${esc(h.title)}</div>${h.link?`<a href="${esc(h.link)}" target="_blank" rel="noopener">Source: ${esc(h.src)}</a>`:""}</div>`).join("")||"<p class='mu'>No matching official policy headlines this period.</p>";
  return `<button class="back" onclick="SR=null;render()">← Back</button>
  <div class="card"><div class="top"><span class="sym">${esc(x.name)}</span><span class="badge ${top?"LOW":x.group=="UNDER"?"HIGH":"NA"}">${top?"TOP PERFORMER":x.group=="UNDER"?"UNDERPERFORMER":"MIDDLE"}</span></div>
  <h2>Score ${n(x.score)}/100 · ${x.n} stocks</h2>
  <p class="mu">${top?"Why it is outperforming":"Why it is underperforming"}: the factors below that point ${top?"up":"down"}.</p></div>`+
  (x.drivers&&x.drivers.length?`<h2>Real-world drivers for this sector</h2>`+x.drivers.map(d=>`<div class="card"><div class="top"><b>${esc(d.title)}</b><button class="badge ${/^Negative/i.test(d.current_view||"")?"HIGH":/^Positive/i.test(d.current_view||"")?"LOW":"NA"}" style="border:0;cursor:pointer" onclick="const b=this.closest('.card').querySelector('.srcbox');b.style.display=b.style.display=='block'?'none':'block'">${esc((d.current_view||"Watch").split(":")[0])}</button></div>
  <div style="font-size:13px;margin-top:4px"><b class="pos">Good when:</b> ${esc(d.good_when)}</div>
  <div style="font-size:13px"><b class="neg">Bad when:</b> ${esc(d.bad_when)}</div>
  <div class="srcbox" style="display:none;margin-top:8px;padding:8px;border-radius:8px;background:var(--bd);font-size:12px">
    ${d.current_view?`<div><b>Current view:</b> ${esc(d.current_view)}</div>`:`<div><b>Current view:</b> Watch</div>`}
    <div class="mu" style="margin-top:4px">Source: ${esc(d.source)}${d.date?" · "+esc(d.date):""}</div>
    ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">Open source</a>`:""}
  </div></div>`).join(""):"")+
  (main.map(row).join("")||"<p class='mu'>No factor clearly points this way.</p>")+
  `<h2>Other factors</h2>`+other.map(row).join("")+
  `<h2>Official policy headlines</h2>`+hl+
  `<p class="mu">${esc((SEC.flows||{}).text||"")}</p>
  <p class="mu">Scores rank sectors against each other. Reasons explain the ranking but don't prove cause. Not advice.</p>`;
}
/* ---------- Tab 1: Right valuation (Nifty 500 from data.json) ---------- */
function valTab(){
  if(sel){$("app").innerHTML=valCard(D.valuation.find(v=>v.symbol==sel));return}
  if(!$("q")){$("app").innerHTML=`<input id="q" placeholder="Search stock name or symbol"><div id="vres"></div>`;
    $("q").addEventListener("input",e=>{qy=e.target.value;sel=null;valTab()});}
  if($("q").value!==qy)$("q").value=qy;
  const q=qy.trim().toLowerCase();
  const m=q?D.valuation.filter(v=>v.symbol.toLowerCase().includes(q)||v.name.toLowerCase().includes(q)).slice(0,8):[];
  $("vres").innerHTML=m.map(v=>`<div class="card" onclick="sel='${v.symbol}';valTab()"><span class="sym">${esc(v.symbol)}</span> <span class="mu">${esc(v.name)}</span></div>`).join("")||(q?"<p class='mu'>Not found. Only Nifty 500 stocks are covered here.</p>":"<p class='mu'>Type a stock name to see its valuation.</p>");
}
function valCard(v){
  if(!v)return "<p class='mu'>Not found.</p>";
  const lab={LOW:"LOW valuation",OK:"RIGHT valuation (OK)",HIGH:"HIGH valuation",NA:"Not available"}[v.verdict];
  const sm=v.sector_med||{};
  return `<div class="card"><div class="top"><span><span class="sym">${esc(v.symbol)}</span><div class="mu">${esc(v.name)} · ${esc(v.industry)}</div></span><span class="badge ${v.verdict}">${lab}</span></div>
  <h2>₹${n(v.price)} <span class="mu">M.Cap ₹${n(v.mcap_cr)} cr</span></h2>
  <table><tr><td>PE (sector median ${n(sm.pe)})</td><td>${n(v.pe)}</td></tr><tr><td>Forward PE</td><td>${n(v.fpe)}</td></tr>
  <tr><td>EV/EBITDA (sector ${n(sm.ev)})</td><td>${n(v.ev)}</td></tr><tr><td>P/B (sector ${n(sm.pb)})</td><td>${n(v.pb)}</td></tr>
  <tr><td>PEG</td><td>${n(v.peg)}</td></tr><tr><td>ROE</td><td>${v.roe==null?"–":n(v.roe*100)+"%"}</td></tr>
  <tr><td>Earnings growth</td><td>${v.eg==null?"–":n(v.eg*100)+"%"}</td></tr><tr><td>Revenue growth</td><td>${v.rg==null?"–":n(v.rg*100)+"%"}</td></tr>
  <tr><td>Debt / Equity</td><td>${n(v.de)}</td></tr></table>
  <p class="mu">${(v.why||[]).map(esc).join(" · ")}</p><button class="back" onclick="sel=null;valTab()">← Back to search</button></div>`;
}
/* ---------- Tab 2: Order book ---------- */
function ordTab(){
  const O=D.orders||[];
  if(ord!==null){const o=O[ord];$("app").innerHTML=`<button class="back" onclick="ord=null;render()">← Back</button><div class="card"><h2>${esc(o.symbol)} <span class="mu">${esc(o.date)}</span></h2><div class="mu">${esc(o.title)}</div><p>${esc(o.text)}</p>${o.link?`<a href="${esc(o.link)}" target="_blank" rel="noopener">Open filing (PDF)</a>`:""}</div>`;return}
  $("app").innerHTML=`<div class="mu">Biggest order wins announced in the last 90 days (value shown only when the filing states it)</div>`+
  (O.map((o,i)=>`<div class="card" onclick="ord=${i};render()"><div class="top"><span><span class="sym">${esc(o.symbol)}</span> <span class="mu">${esc(o.date)}</span></span><b>${o.value_cr?"₹"+n(o.value_cr)+" cr":"Value n/a"}</b></div>
  <div class="mu">${esc(o.name)}</div><div style="font-size:13px">${esc((o.text||o.title).slice(0,140))}…</div></div>`).join("")||"<p class='mu'>No orders found.</p>");
}
/* ---------- Shared stock card (Search + F&O) ---------- */
function whyBlock(s){
  if(s.bias!="UPSIDE"&&s.bias!="DOWNSIDE")return "<h2>Why</h2><p class='mu'>No dominant direction today. Signals are mixed.</p>";
  const R=s.reasons&&s.reasons[s.bias]; const items=(R&&R.items)||[];
  const pref=items.filter(x=>x.cat!=="Sector demand");
  const pick=(pref.length?pref:items).slice(0,4);
  if(!pick.length)return `<h2>Why ${s.bias}</h2><p class='mu'>Not enough sourced company reasons today. Use the bias scores below.</p>`;
  return `<h2>Why ${s.bias} (${esc(R.confidence)} confidence)</h2>`+pick.map(x=>`<div class="card"><b>${esc(x.cat)}:</b> ${esc(x.text)}
    <div class="mu">Source: ${esc(x.src)}${x.date?" · "+esc(x.date):""}</div>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener">Open filing</a>`:""}</div>`).join("");
}
function stockCard(s){
  if(!s)return "<p class='mu'>Stock not found in Nifty 500 or F&O list.</p>";
  const v=s.valuation||{};
  const vlab={LOW:"LOW valuation",OK:"RIGHT valuation (OK)",HIGH:"HIGH valuation"}[v.verdict]||"Valuation not available";
  const idx=(s.indices||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join("")||"<span class='tag'>Outside Nifty 500</span>";
  const rl=s.rsi==null?"":s.rsi>=70?"Overbought":s.rsi<=30?"Oversold":s.rsi>=50?"Bullish zone":"Weak zone";
  const bars=(s.deliv||[]).map(d=>`<div class="brow"><span>${esc(d.date)}</span><div class="bar"><i style="width:${d.pct||0}%"></i></div><span>${d.pct==null?"–":n(d.pct)+"%"}</span></div>`).join("")||"<p class='mu'>Delivery data not available yet</p>";
  const core=s.bias=="UPSIDE"?(s.up_reasons[0]||"Mixed signals"):s.bias=="DOWNSIDE"?(s.down_reasons[0]||"Mixed signals"):"No dominant signal";
  const blk=(t,sc,rs,col)=>`<div class="card"><div class="top"><b>${t}</b><b>${sc}/100</b></div><div class="bar"><i style="width:${sc}%;background:${col}"></i></div><div class="mu">${(rs||[]).map(esc).join(" · ")||"No strong signal"}</div></div>`;
  const big=s.mcap_cr!=null&&s.mcap_cr>=10000;
  return `<div class="card"><div class="top"><span><span class="sym">${esc(s.symbol)}</span><div class="mu">${esc(s.name)}</div></span>${s.fno?'<span class="tag fno">F&amp;O stock</span>':'<span class="tag nofo">null (not F&amp;O)</span>'}</div>
  <div style="margin:6px 0">${idx}</div>
  <div class="mu">Market cap ${s.mcap_cr!=null?"₹"+n(s.mcap_cr)+" cr":"–"} · <span class="${big?"pos":"neg"}">${big?"above ₹10,000 cr":"below ₹10,000 cr"}</span></div>
  <h2>₹${n(s.price)}</h2>
  <div class="row" style="align-items:center"><span class="badge ${v.verdict||"NA"}">${vlab}</span><span class="badge NA">RSI ${n(s.rsi)} · ${rl}</span></div>
  <p class="mu">${(v.why||[]).map(esc).join(" · ")}</p>
  <h2>Delivery volume, last 5 trading days</h2>${bars}
  <h2>Momentum score (next month)</h2><div class="card"><b>${n(s.momentum)}/100</b><div class="bar"><i style="width:${s.momentum}%"></i></div></div>
  <h2>Bias: <span class="${s.bias=='UPSIDE'?'pos':s.bias=='DOWNSIDE'?'neg':''}">${s.bias}</span></h2>
  ${whyBlock(s)}
  ${blk("Upside bias",s.up,s.up_reasons,"var(--gd)")}${blk("Downside bias",s.down,s.down_reasons,"var(--bdc)")}
  <p class="mu">Rule-based signals from price, RSI, delivery and valuation. Not a prediction or advice.</p></div>`;
}
/* ---------- Tab 3: Search ---------- */
function searchTab(){
  const list=SX&&SX.stocks?SX.stocks:[];
  if(!list.length){$("app").innerHTML="<p class='mu'>Stock data not built yet. Run the 'Update stock search' workflow once.</p>";return}
  if(ssel){$("app").innerHTML=`<button class="back" onclick="ssel=null;searchTab()">← Back to search</button>`+stockCard(list.find(s=>s.symbol==ssel));return}
  if(!$("sq")){$("app").innerHTML=`<input id="sq" placeholder="Type stock name or symbol"><div id="sres"></div>`;
    $("sq").addEventListener("input",e=>{sq=e.target.value;searchTab()});}
  if($("sq").value!==sq)$("sq").value=sq;
  const q=sq.trim().toLowerCase();
  const m=q?list.filter(s=>s.symbol.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)).slice(0,8):[];
  $("sres").innerHTML=m.map(s=>`<div class="card" onclick="ssel='${s.symbol}';searchTab()"><span class="sym">${esc(s.symbol)}</span> <span class="mu">${esc(s.name)}</span> ${s.fno?'<span class="tag fno">F&amp;O</span>':''}</div>`).join("")||
   (q?"<p class='mu'>Not found in Nifty 500 or F&amp;O list.</p>":"<p class='mu'>Covers Nifty 50, Next 50, 200, 500 and F&amp;O stocks.</p>");
}
/* ---------- Tab 6: Companies results ---------- */
function resTab(){
  if(RSEL!==null){$("app").innerHTML=resDetail(RSEL);return}
  if(!RES||!RES.updated){$("app").innerHTML="<p class='mu'>Results not built yet. Run the 'Update company results' workflow once.</p>";return}
  const vc=v=>v=="GOOD"?"LOW":v=="VERY BAD"?"HIGH":"NA";
  const fb=(lab,val)=>`<button class="btn ${RFIL==val?"on":""}" style="flex:none;padding:8px 10px;font-size:13px" onclick="RFIL='${val}';resTab()">${lab}</button>`;
  const head=`<div class="row"><button class="btn ${RSUB=="present"?"on":""}" onclick="RSUB='present';resTab()">Present result</button><button class="btn ${RSUB=="upcoming"?"on":""}" onclick="RSUB='upcoming';resTab()">Upcoming results</button></div>`;
  if(RSUB=="upcoming"){
    $("app").innerHTML=head+`<div class="mu">Expected result dates from Yahoo Finance. Dates can move, so check the company's board-meeting notice.</div>`+
      (RES.upcoming||[]).map(x=>`<div class="card"><div class="top"><span><span class="badge ${x.fno?"LOW":"NA"}">${x.fno?"F&O":"Non F&O"}</span> <span class="sym">${esc(x.symbol)}</span><div class="mu">${esc(x.name)}</div></span><b>${esc(x.next_date)}</b></div></div>`).join("")||"<p class='mu'>No upcoming dates found.</p>";
    return;
  }
  const L=(RES.present||[]).filter(x=>RFIL=="all"||x.verdict==RFIL);
  $("app").innerHTML=head+`<div class="row">${fb("All","all")}${fb("GOOD","GOOD")}${fb("NEUTRAL","NEUTRAL")}${fb("VERY BAD","VERY BAD")}</div>`+
    `<div class="mu">${L.length} companies. Left label shows F&amp;O or Non F&amp;O. Tap a company for its breakdown.</div>`+
    L.map(x=>`<div class="card" onclick="RSEL='${x.symbol}';resTab()"><div class="top"><span><span class="badge ${x.fno?"LOW":"NA"}">${x.fno?"F&O":"Non F&O"}</span> <span class="sym">${esc(x.symbol)}</span><div class="mu">${esc(x.name)}</div><div class="mu">Result ${esc(x.reported_on||"–")} · quarter ended ${esc(x.quarter_end)}</div></span><span class="badge ${vc(x.verdict)}">${esc(x.verdict)}</span></div></div>`).join("")||"<p class='mu'>No companies for this filter.</p>";
}
function resDetail(sym){
  const x=(RES.present||[]).find(v=>v.symbol==sym);
  if(!x)return "<button class='back' onclick='RSEL=null;resTab()'>← Back</button><p class='mu'>Not found.</p>";
  const vcl=x.verdict=="GOOD"?"LOW":x.verdict=="VERY BAD"?"HIGH":"NA";
  const colr=x.verdict=="GOOD"?"var(--gd)":x.verdict=="VERY BAD"?"var(--bdc)":"var(--mu)";
  const bdRows=(x.breakdown||[]).map(b=>`<tr><td>${esc(b.factor)}</td><td>${esc(b.seen)}</td><td class="${b.points>0?"pos":b.points<0?"neg":""}">${b.points>0?"+":""}${n(b.points)}</td></tr>`).join("");
  const hist=x.history||[];
  const hHead=`<tr><td></td>${hist.map(h=>`<td>${esc(h.q)}</td>`).join("")}</tr>`;
  const hRow=(lab,key)=>`<tr><td>${lab}</td>${hist.map(h=>`<td>${h[key]==null?"–":n(h[key])}</td>`).join("")}</tr>`;
  const list=(arr,col)=>arr.length?arr.map(t=>`<div class="card" style="font-size:13px;border-left:4px solid ${col}">${esc(t)}</div>`).join(""):"<p class='mu'>None clear from the data.</p>";
  return `<button class="back" onclick="RSEL=null;resTab()">← Back</button>
  <div class="card" style="border-width:2px;border-color:${colr}"><div class="top"><span><span class="sym">${esc(x.symbol)}</span><div class="mu">${esc(x.name)}</div></span><span class="badge ${vcl}">${esc(x.verdict)}</span></div>
  <div style="margin-top:8px">${esc(x.summary||"")}</div>
  <div class="mu" style="margin-top:6px">Quarter ended ${esc(x.quarter_end)} · result date ${esc(x.reported_on||"–")} · score ${n(x.score)}</div></div>
  <h2>Why it is ${esc(x.verdict)}: score breakdown</h2>
  <table><tr><td>Factor</td><td>What the data shows</td><td>Points</td></tr>${bdRows||"<tr><td colspan=3>Breakdown not available. Run the results update again.</td></tr>"}</table>
  <h2>Strengths</h2>${list(x.strengths||[],"var(--gd)")}
  <h2>Weaknesses</h2>${list(x.weaknesses||[],"var(--bdc)")}
  <h2>Last 4 quarters (₹ cr)</h2>
  <table>${hHead}${hRow("Sales","sales")}${hRow("PAT","pat")}${hRow("OPM %","opm")}${hRow("Debt","debt")}${hRow("Op. cash flow","ocf")}</table>
  <h2>What would change it</h2><div class="card" style="font-size:13px">${esc(x.next_step||"")}</div>
  <h2>Management and outlook</h2><p class="mu">Yahoo Finance has no management commentary. Read the results presentation and management remarks in the company's NSE filings.</p>
  <a href="${esc(x.filings_url)}" target="_blank" rel="noopener">Open company filings on NSE</a>
  <p class="mu">Based on Yahoo Finance quarterly data. A rules-based summary, not advice.</p>`;
}
/* ---------- Tab 4: F&O Stocks ---------- */
function foTab(){
  if(TR){$("app").innerHTML=trPage();return}
  if(RS){$("app").innerHTML=reasonPage();return}
  const list=SX&&SX.stocks?SX.stocks:[];
  if(!list.length){$("app").innerHTML="<p class='mu'>Stock data not built yet.</p>";return}
  if(fsel){$("app").innerHTML=`<button class="back" onclick="fsel=null;foTab()">← Back to F&amp;O list</button>`+stockCard(list.find(s=>s.symbol==fsel));return}
  const all=list.filter(s=>s.fno);
  const shown=all.filter(s=>fq=="all"||s.bias==fq);
  $("app").innerHTML=`<div class="mu">${all.length} F&amp;O stocks, sorted by momentum score. Tap the UPSIDE or DOWNSIDE button for its reasons.</div>
  <div class="row"><button class="btn ${fq=="all"?"on":""}" onclick="fq='all';foTab()">All</button><button class="btn g ${fq=="UPSIDE"?"on":""}" onclick="fq='UPSIDE';foTab()">Upside</button><button class="btn b ${fq=="DOWNSIDE"?"on":""}" onclick="fq='DOWNSIDE';foTab()">Downside</button><button class="btn" onclick="TR=true;foTab()">Track record</button></div>`+
  shown.map(s=>{const dir=s.bias=="DOWNSIDE"||(s.bias=="NEUTRAL"&&s.down>s.up)?"DOWNSIDE":"UPSIDE";
    return `<div class="card" onclick="fsel='${s.symbol}';foTab()"><div class="top"><span><span class="sym">${esc(s.symbol)}</span><div class="mu">${esc(s.name)}</div></span>
    <span><b>${n(s.momentum)}</b> <button class="badge ${dir=='UPSIDE'?'LOW':'HIGH'}" style="border:0;cursor:pointer" onclick="event.stopPropagation();RS={sym:'${s.symbol}',dir:'${dir}'};foTab()">${dir}</button></span></div>
    <div class="mu">₹${n(s.price)} · RSI ${n(s.rsi)} · ${s.mcap_cr!=null?"₹"+n(s.mcap_cr)+" cr":""} · ${s.bias}</div></div>`}).join("")||"<p class='mu'>No stocks in this group.</p>";
}
/* ---------- Tab 5: Options (NSE snapshots) ---------- */
function optTab(){
  const items=(OPT&&OPT.items)||{}; const keys=Object.keys(items);
  if(!keys.length){$("app").innerHTML="<p class='mu'>Option data not built yet. Run the 'Update option data' workflow once.</p>";return}
  if(!$("oq")){$("app").innerHTML=`<input id="oq" placeholder="Type index or F&amp;O stock (NIFTY, BANKNIFTY, RELIANCE)"><div id="ores"></div>`;
    $("oq").addEventListener("input",e=>{oq=e.target.value;osel=null;optTab()});}
  if($("oq").value!==oq)$("oq").value=oq;
  if(osel!==null&&items[osel]){$("ores").innerHTML=optCard(items[osel]);return}
  const q=oq.trim().toLowerCase();
  const m=q?keys.filter(k=>k.toLowerCase().includes(q)||(items[k].name||"").toLowerCase().includes(q)).slice(0,10):[];
  $("ores").innerHTML=m.map(k=>`<div class="card" onclick="osel='${k}';optTab()"><span class="sym">${esc(k)}</span> <span class="mu">${esc(items[k].verdict)}</span></div>`).join("")||
    (q?"<p class='mu'>Not found in index or F&amp;O list.</p>":"<p class='mu'>Type an index (NIFTY, BANKNIFTY, FINNIFTY, MIDCPNIFTY) or an F&amp;O stock.</p>");
}
const toMin=t=>{const [hh,mm]=String(t).split(":").map(Number);return hh*60+mm};
function dayHtml(sym){
  const S=(OPTD&&OPTD.snapshots)||[];
  const pts=S.map(s=>({t:s.t,d:(s.items||{})[sym]})).filter(p=>p.d);
  const lab=m=>m>=60?(m/60)+" hour":m+" min";
  const btnRow=`<div class="row" style="margin:8px 0">${[5,10,15,30,60].map(m=>`<button class="btn ${OWIN==m?"on":""}" style="flex:none;padding:8px 10px;font-size:13px" onclick="OWIN=${m};optTab()">${lab(m)}</button>`).join("")}</div>`;
  if(!pts.length)return btnRow+"<p class='mu'>No intraday snapshots for this symbol today yet.</p>";
  const L=pts[pts.length-1], last=L.t;
  const target=toMin(last)-OWIN;
  let B=null; for(const p of pts){ if(toMin(p.t)<=target) B=p; }
  const enough=!!B, base=B||pts[0];
  const dce=L.d.ce-base.d.ce, dpe=L.d.pe-base.d.pe;
  const mx=Math.max(Math.abs(dce),Math.abs(dpe),1);
  let vt,vc,vd;
  if(dce<=0&&dpe<=0){vt="UNWINDING · both sides reducing";vc="NA";vd="Call and put OI are both falling, so positions are being closed. Neutral signal.";}
  else if(dce>1.2*Math.max(dpe,1)){vt="CALL WRITER DOMINANT · bearish pressure";vc="HIGH";vd="Call OI is rising much faster than put OI, so sellers are adding calls. Resistance is building.";}
  else if(dpe>1.2*Math.max(dce,1)){vt="PUT WRITER DOMINANT · bullish support";vc="LOW";vd="Put OI is rising much faster than call OI, so sellers are adding puts. Support is building.";}
  else {vt="BALANCED · no clear writer side";vc="NA";vd="Call and put OI are rising at a similar pace. No clear side yet.";}
  const mode=last>="15:25"?"After-market summary":"Live, last update "+last+" IST";
  const verdictBox=`<div class="card" style="border-width:2px;border-color:${vc=="HIGH"?"var(--bdc)":vc=="LOW"?"var(--gd)":"var(--bd)"}">
    <div class="top"><b>${vt}</b><span class="badge ${vc}">${lab(OWIN)}</span></div>
    <div style="font-size:13px;margin-top:6px">${vd}</div>
    <div class="mu" style="margin-top:6px">${mode}. ${enough?"Compared with "+esc(base.t)+" snapshot.":"Not enough history for "+lab(OWIN)+" yet, so compared with "+esc(base.t)+"."}</div></div>`;
  const bars=`<div class="card"><div class="mu">Change in OI over ${lab(OWIN)}</div>
    <div class="brow"><span>Call OI</span><div class="bar"><i style="width:${Math.round(100*Math.abs(dce)/mx)}%;background:var(--bdc)"></i></div><span>${dce>=0?"+":""}${n(dce)}</span></div>
    <div class="brow"><span>Put OI</span><div class="bar"><i style="width:${Math.round(100*Math.abs(dpe)/mx)}%;background:var(--gd)"></i></div><span>${dpe>=0?"+":""}${n(dpe)}</span></div></div>`;
  const W=600,HH=120;
  const ces=pts.map(p=>p.d.ce), pes=pts.map(p=>p.d.pe);
  const mn=Math.min(...ces,...pes), mxv=Math.max(...ces,...pes,mn+1);
  const X=i=>pts.length<2?W/2:20+i*(W-40)/(pts.length-1);
  const Y=v=>HH-10-(v-mn)/(mxv-mn)*(HH-20);
  const poly=arr=>arr.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  const bi=Math.max(0,pts.indexOf(base)), li=pts.length-1;
  const shade=pts.length>1?`<rect x="${X(bi)}" y="0" width="${Math.max(1,X(li)-X(bi))}" height="${HH}" fill="#7aa2ff" opacity=".18"/>`:"";
  const chart=`<div class="card"><div class="mu">OI through the day: calls red, puts green, shaded = selected window</div>
    <svg viewBox="0 0 ${W} ${HH}" width="100%" style="margin-top:6px">${shade}
    <polyline points="${poly(ces)}" fill="none" stroke="#ff6b60" stroke-width="2.5"/>
    <polyline points="${poly(pes)}" fill="none" stroke="#3ccf85" stroke-width="2.5"/></svg>
    <div class="mu" style="display:flex;justify-content:space-between"><span>${esc(pts[0].t)}</span><span>${esc(last)}</span></div></div>`;
  const rows=pts.slice(-40).map(p=>`<tr><td>${esc(p.t)}</td><td>${n(p.d.ce)}</td><td>${n(p.d.pe)}</td><td>${p.d.pcr==null?"–":n(p.d.pcr)}</td></tr>`).join("");
  return btnRow+verdictBox+bars+chart+`<table><tr><td>Time</td><td>Call OI</td><td>Put OI</td><td>PCR</td></tr>${rows}</table>`;
}
function optCard(x){
  const vc=x.verdict.startsWith("CALL")?"HIGH":x.verdict.startsWith("PUT")?"LOW":"NA";
  const tot=Math.max(1,x.ce_oi+x.pe_oi), cb=Math.max(1,Math.abs(x.ce_chg)+Math.abs(x.pe_chg));
  const bar=(a,b,col)=>`<div class="bar"><i style="width:${Math.min(100,Math.round(100*a/Math.max(1,b)))}%;background:${col}"></i></div>`;
  const rows=(x.strikes||[]).map(s=>`<tr><td>${n(s.strike)}</td><td>${n(s.ce_oi)}</td><td class="${s.ce_chg>=0?"pos":"neg"}">${n(s.ce_chg)}</td><td>${n(s.pe_oi)}</td><td class="${s.pe_chg>=0?"pos":"neg"}">${n(s.pe_chg)}</td></tr>`).join("");
  return `<button class="back" onclick="osel=null;optTab()">← Back</button>
  <div class="card"><div class="top"><span><span class="sym">${esc(x.symbol)}</span><div class="mu">${esc(x.type)} · expiry ${esc(x.expiry)}</div></span><span class="badge ${vc}">${esc(x.verdict)}</span></div>
  <h2>Underlying ${n(x.underlying)} · PCR ${n(x.pcr)} · Max pain ${n(x.max_pain)}</h2>
  <div class="mu">Total call OI ${n(x.ce_oi)} · put OI ${n(x.pe_oi)}</div>${bar(x.ce_oi,tot,"var(--bdc)")}${bar(x.pe_oi,tot,"var(--gd)")}
  <p class="mu">Resistance (highest call OI): ${(x.resistance||[]).map(v=>n(v)).join(", ")} · Support (highest put OI): ${(x.support||[]).map(v=>n(v)).join(", ")}</p>
  <p class="mu">Snapshot taken ${esc(OPT.updated?new Date(OPT.updated).toLocaleString():"–")}. Updates about every 5 minutes in market hours, not per second.</p></div>
  ${dayHtml(x.symbol)}<h2>Strikes near the money</h2><table><tr><td>Strike</td><td>Call OI</td><td>Call Δ</td><td>Put OI</td><td>Put Δ</td></tr>${rows}</table>
  <p class="mu">Call writer = calls being sold, usually bearish. Put writer = puts being sold, usually bullish. Not advice.</p>`;
}
function trPage(){
  const back=`<button class="back" onclick="TR=false;foTab()">← Back to F&amp;O list</button>`;
  const live=(TRD&&TRD.summary||[]).map(r=>`<div class="card"><div class="top"><b>${esc(r.bias)} · ${esc(r.confidence)}</b><span>${r.hit_rate==null?"–":n(r.hit_rate)+"%"}</span></div><div class="mu">${r.picks} picks · avg excess vs Nifty ${p(r.avg_excess)}</div></div>`).join("")||"<p class='mu'>No live record yet. It fills after the first full month of snapshots.</p>";
  const bt=(BT&&BT.summary||[]).map(r=>`<div class="card"><div class="top"><b>${esc(r.bias)}</b><span>${r.hit_rate==null?"–":n(r.hit_rate)+"%"}</span></div><div class="mu">${r.signals} signals · avg excess vs Nifty ${p(r.avg_excess)}</div></div>`).join("")||"<p class='mu'>Backtest not run yet.</p>";
  return `${back}<h2>Live track record (frozen monthly picks)</h2>${live}
  <h2>Backtest, price signals only</h2>${bt}
  ${BT&&BT.baseline!=null?`<p class="mu">Baseline: ${n(BT.baseline)}% of all stocks beat the Nifty in the same months. ${esc(BT.note||"")}</p>`:""}
  <p class="mu">Hit rate = share of UPSIDE picks that beat the Nifty, or DOWNSIDE picks that lagged it, over the next month. Only a clear gap above the baseline suggests a real edge, and small samples are unreliable.</p>`;
}
function reasonPage(){
  const s=(SX&&SX.stocks||[]).find(x=>x.symbol==RS.sym); const R=s&&s.reasons&&s.reasons[RS.dir];
  const back=`<button class="back" onclick="RS=null;foTab()">← Back to F&amp;O list</button>`;
  if(!R)return back+"<p class='mu'>No reasons available for this stock.</p>";
  const col=RS.dir=="UPSIDE"?"var(--gd)":"var(--bdc)";
  const cb=R.confidence=="HIGH"?"LOW":R.confidence=="MEDIUM"?"OK":"NA";
  return `${back}<div class="card"><div class="top"><span><span class="sym">${esc(s.symbol)}</span> <span class="mu">${esc(s.name)}</span></span><b style="color:${col}">${RS.dir}</b></div>
  <h2>Confidence: <span class="badge ${cb}">${R.confidence}</span></h2>
  <p class="mu">${R.count} genuine reasons found across ${R.cats} categories${R.count<10?" (fewer than 10 sourced reasons were available today)":""}</p></div>`+
  (R.items.length?R.items.map((it,i)=>`<div class="card"><div class="top"><b>${i+1}. ${esc(it.cat)}</b><span class="mu">${esc(it.date||"")}</span></div>
  <div style="margin-top:4px">${esc(it.text)}</div>${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">Source: ${esc(it.src)}</a>`:`<div class="mu">Source: ${esc(it.src)}</div>`}</div>`).join(""):"<p class='mu'>No sourced reasons in this direction.</p>")+
  `<p class="mu">Reasons come only from NSE filings, RBI and PIB releases, and price and delivery data. Not advice.</p>`;
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
load();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sel===null&&sec===null&&ord===null&&fsel===null&&ssel===null)load()});
</script></body></html>
